<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bibHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc800" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffc800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffc800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Antena & bohlam emas bercahaya -->
  <g class="robot__antenna">
    <line x1="60" y1="30" x2="60" y2="16" stroke="#46a302" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="60" cy="13" r="10.5" fill="url(#bibHalo)"/>
    <circle cx="60" cy="13" r="5.5" fill="#ffc800" stroke="#46a302" stroke-width="2.5"/>
  </g>

  <!-- Cangkang hijau khas CodeDuo (gaya Duolingo) -->
  <rect x="20" y="27" width="80" height="72" rx="24" fill="#58cc02" stroke="#46a302" stroke-width="3.5"/>

  <!-- Layar kaca wajah putih lembut -->
  <rect x="32" y="40" width="56" height="46" rx="16" fill="#f7f9fb"/>
  
  <!-- Kilau refleksi kaca atas -->
  <path d="M36 44 Q60 41 84 44 A14 14 0 0 1 86 49 Q60 46 34 49 Z" fill="url(#glassGlare)"/>

  <!-- Mata tersenyum bahagia (^ ^) -->
  <g class="robot__eyes">
    <path d="M42 61 q6 -9.5 12 0" fill="none" stroke="#3c3c3c" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M66 61 q6 -9.5 12 0" fill="none" stroke="#3c3c3c" stroke-width="3.8" stroke-linecap="round"/>
  </g>

  <!-- Mulut tersenyum ramah dan manis -->
  <g class="robot__mouth-wrap">
    <path d="M49 71 q11 10.5 22 0" fill="none" stroke="#3c3c3c" stroke-width="3.8" stroke-linecap="round"/>
  </g>

  <!-- Pipi merona ceria merah muda (blush) -->
  <circle cx="35" cy="69" r="5.5" fill="#ff9a9a" opacity="0.7"/>
  <circle cx="85" cy="69" r="5.5" fill="#ff9a9a" opacity="0.7"/>
</svg>